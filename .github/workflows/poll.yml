name: BSE Results Poller

on:
  schedule:
    # Full months active: January, April, May, July, October — entire month, 12:00 PM-10:00 PM IST
    - cron: '30,40,50 6 * 1,4,5,7,10 *'
    - cron: '*/10 7-15 * 1,4,5,7,10 *'
    - cron: '0,10,20,30 16 * 1,4,5,7,10 *'

    # Partial months active: February, June, August, November — days 1-14 only, same daily window
    - cron: '30,40,50 6 1-14 2,6,8,11 *'
    - cron: '*/10 7-15 1-14 2,6,8,11 *'
    - cron: '0,10,20,30 16 1-14 2,6,8,11 *'

  workflow_dispatch:   # lets you trigger it manually anytime, even outside the active season

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run poller
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python poller.py

      - name: Save updated state back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json scripcode_cache.json
          git diff --staged --quiet || git commit -m "Update seen announcements and scrip code cache"
          git push